<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080812" />
      <stop offset="50%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#05030A" />
    </linearGradient>

    <!-- Neon Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Rust Orange Gradient -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#FF7300" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .fondo  { fill: url(#bgGrad); }
    .titulo { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 900; font-size: 46px; fill: url(#goldGrad); letter-spacing: 2px; }
    .sub    { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 14px; fill: #94A3B8; letter-spacing: 3px; }
    .chapa  { fill: #161528; stroke-width: 1.5; rx: 8px; }
    .ctexto { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
    .circuito { stroke: url(#cyanGrad); stroke-width: 1.5; fill: none; opacity: 0.35; stroke-dasharray: 12 8; }
  </style>

  <!-- Base Layer -->
  <rect class="fondo" width="920" height="320" rx="16" stroke="#2E2B54" stroke-width="2" />

  <!-- Animated Circuit Grid -->
  <path class="circuito" d="M 40,45 H 880 M 40,275 H 880 M 110,0 V 320 M 810,0 V 320 M 40,160 H 260 M 660,160 H 880" />

  <!-- Orbiting Floating Particles -->
  <circle cx="140" cy="90" r="3" fill="#00F2FE">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="90;80;90" dur="4s" repeatCount="indefinite" />
  </circle>

  <circle cx="780" cy="230" r="3.5" fill="#FFA751">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="5s" repeatCount="indefinite" />
    <animate attributeName="cy" values="230;220;230" dur="5s" repeatCount="indefinite" />
  </circle>

  <circle cx="200" cy="250" r="2.5" fill="#38BDF8">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <circle cx="720" cy="75" r="3" fill="#00F2FE">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Central Logo Badge with Rotation Animation -->
  <g transform="translate(460, 105)">
    <!-- Spinning Geometric Runic Frame -->
    <g filter="url(#neonGlow)">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      <polygon points="0,-40 38,-12 24,34 -24,34 -38,-12" fill="#120E29" stroke="url(#goldGrad)" stroke-width="2.5"/>
    </g>
    <!-- Inner Dragon Crest -->
    <path d="M -16,-12 L 0,-28 L 16,-12 L 0,22 Z" fill="url(#goldGrad)" />
    <circle cx="-46" cy="0" r="4.5" fill="#00F2FE" filter="url(#subtleGlow)" />
    <circle cx="46" cy="0" r="4.5" fill="#FF7300" filter="url(#subtleGlow)" />
  </g>

  <!-- Titles -->
  <text x="460" y="195" text-anchor="middle" class="titulo">DRAKESCRAFT LABS</text>
  <text x="460" y="225" text-anchor="middle" class="sub">HIGH-PERFORMANCE MINECRAFT ARCHITECTURE &amp; RUST ENGINE</text>

  <!-- Badges Footer -->
  <g transform="translate(160, 255)">
    <!-- Badge 1: Rust 2021 -->
    <rect x="0" y="0" width="135" height="34" class="chapa" stroke="#FF7300" />
    <circle cx="18" cy="17" r="5" fill="#FF7300" />
    <text x="32" y="22" class="ctexto" fill="#FF7300">RUST 2021</text>

    <!-- Badge 2: Java 21 Panama FFM -->
    <rect x="155" y="0" width="165" height="34" class="chapa" stroke="#FFA751" />
    <circle cx="173" cy="17" r="5" fill="#FFA751" />
    <text x="187" y="22" class="ctexto" fill="#FFA751">JAVA 21 FFM API</text>

    <!-- Badge 3: Purpur 1.21.11 -->
    <rect x="340" y="0" width="155" height="34" class="chapa" stroke="#00F2FE" />
    <circle cx="358" cy="17" r="5" fill="#00F2FE" />
    <text x="372" y="22" class="ctexto" fill="#00F2FE">PURPUR 1.21.11</text>

    <!-- Badge 4: Production Star -->
    <rect x="515" y="0" width="115" height="34" class="chapa" stroke="#A3E635" />
    <circle cx="533" cy="17" r="5" fill="#A3E635" />
    <text x="547" y="22" class="ctexto" fill="#A3E635">STABLE</text>
  </g>
</svg>
