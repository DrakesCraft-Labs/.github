<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080812" />
      <stop offset="50%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#05030A" />
    </linearGradient>

    <!-- Neon Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Rust Orange Gradient -->
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="100%" stop-color="#FF7300" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 15px rgba(255, 180, 0, 0.6)); }
      50% { opacity: 1; filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.9)); }
    }
    @keyframes circuitFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .bg-rect { fill: url(#bgGrad); }
    .title-text { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 900; font-size: 46px; fill: url(#goldGrad); animation: pulseGlow 4s infinite ease-in-out; }
    .subtitle-text { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 600; font-size: 16px; fill: #A0AABF; letter-spacing: 2px; }
    .badge-bg { fill: #161528; stroke: #2E2B54; stroke-width: 1.5; rx: 8px; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; }
    .circuit-line { stroke: url(#cyanGrad); stroke-width: 2; fill: none; stroke-dasharray: 20 10 5 10; animation: circuitFlow 20s linear infinite; opacity: 0.4; }
    .particle { fill: #00F2FE; animation: floatParticle 6s infinite ease-in-out; }
  </style>

  <!-- Base Layer -->
  <rect class="bg-rect" width="920" height="320" rx="16" stroke="#252147" stroke-width="2" />

  <!-- Animated Circuit Grid Background -->
  <path class="circuit-line" d="M 50,40 H 870 M 50,280 H 870 M 100,0 V 320 M 820,0 V 320 M 50,160 H 250 M 670,160 H 870" />

  <!-- Glowing Particles -->
  <circle class="particle" cx="120" cy="80" r="3" style="animation-delay: 0s;" />
  <circle class="particle" cx="800" cy="220" r="4" style="animation-delay: 1.5s;" />
  <circle class="particle" cx="220" cy="260" r="2.5" style="animation-delay: 3s;" />
  <circle class="particle" cx="720" cy="70" r="3.5" style="animation-delay: 4.5s;" />

  <!-- Central Logo Frame -->
  <g transform="translate(460, 110)">
    <!-- Shield / Dragon Icon -->
    <path d="M 0,-45 L 35,-20 L 35,25 L 0,45 L -35,25 L -35,-20 Z" fill="#120E29" stroke="url(#goldGrad)" stroke-width="3" filter="url(#neonGlow)" />
    <path d="M -15,-10 L 0,-25 L 15,-10 L 0,20 Z" fill="url(#goldGrad)" />
    <!-- Floating Orbs -->
    <circle cx="-50" cy="0" r="5" fill="#00F2FE" filter="url(#subtleGlow)" />
    <circle cx="50" cy="0" r="5" fill="#FF4500" filter="url(#subtleGlow)" />
  </g>

  <!-- Title Text -->
  <text x="460" y="200" text-anchor="middle" class="title-text">DRAKESCRAFT LABS</text>
  <text x="460" y="230" text-anchor="middle" class="subtitle-text">HIGH-PERFORMANCE MINECRAFT ARCHITECTURE &amp; RUST ENGINE</text>

  <!-- Badges Footer -->
  <g transform="translate(210, 255)">
    <!-- Badge 1: Rust 2021 -->
    <rect x="0" y="0" width="145" height="34" class="badge-bg" />
    <circle cx="20" cy="17" r="6" fill="#FF4500" />
    <text x="35" y="22" class="badge-text" fill="#FF7300">RUST 2021</text>

    <!-- Badge 2: Java 21 Panama -->
    <rect x="160" y="0" width="165" height="34" class="badge-bg" />
    <circle cx="180" cy="17" r="6" fill="#F89820" />
    <text x="195" y="22" class="badge-text" fill="#FFA751">JAVA 21 FFM API</text>

    <!-- Badge 3: Purpur 1.21.11 -->
    <rect x="340" y="0" width="160" height="34" class="badge-bg" />
    <circle cx="360" cy="17" r="6" fill="#00F2FE" />
    <text x="375" y="22" class="badge-text" fill="#00F2FE">PURPUR 1.21.11</text>
  </g>
</svg>
